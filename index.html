<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>IT Message Picker</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://res.cdn.office.net/teams-js/2.17.0/js/MicrosoftTeams.min.js"></script>
</head>
<body>
    <div class="container">
        <h2>IT Predefined Messages</h2>

        <label>Category</label>
        <select id="category"></select>

        <label>Message</label>
        <select id="message"></select>

        <textarea id="preview" placeholder="Preview…" readonly></textarea>

        <button id="insertBtn">Insert Message</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
