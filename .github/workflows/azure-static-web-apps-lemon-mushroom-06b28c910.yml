name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    # only run deploy on pushes or PRs from the same repository (no fork PR secrets)
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Check AZURE_STATIC_WEB_APPS_API_TOKEN secret
        run: |
          if [ -z "${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}" ]; then
            echo "AZURE_STATIC_WEB_APPS_API_TOKEN is empty or inaccessible in this run"
            exit 1
          else
            echo "AZURE_STATIC_WEB_APPS_API_TOKEN is present"
          fi
          
      - name: Verify AZURE_STATIC_WEB_APPS_API_TOKEN is present
        run: |
         SECRET="${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}"
         if [ -z "$SECRET" ]; then
          echo "AZURE_STATIC_WEB_APPS_API_TOKEN is empty or inaccessible in this run"
          exit 1
         fi
         echo "AZURE_STATIC_WEB_APPS_API_TOKEN length: ${#SECRET}"
         if printf '%s' "$SECRET" | grep -q $'\n'; then
          echo "Secret contains newline(s) — regenerate and re-save"
          exit 1
         fi
 
      - name: Build And Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "."        # repo root
          api_location: ""         # set if you have an API folder
          output_location: "."     # build output / repo root
          skip_app_build: true






